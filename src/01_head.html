/* Layout: full-bleed WebGL yard at night; HUD pinned to the four corners; menus are freight work-order sheets laid over the scene. Single committed night look. */
:root {
  --night: #0d1220;
  --panel: rgba(13, 18, 32, 0.78);
  --panel-line: rgba(233, 228, 216, 0.16);
  --ink: #ece6d8;
  --steel: #8f9bb0;
  --sodium: #f2a33a;
  --sodium-deep: #b8701c;
  --alarm: #ff5260;
  --vital: #5ed6b0;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; inset: 0; pointer-events: none; font-variant-numeric: tabular-nums; }
.hud[hidden] { display: none !important; }

/* crosshair */
#cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#cross i { position: absolute; background: var(--ch, var(--ink)); box-shadow: 0 0 2px rgba(0,0,0,.8); }
#cross .h { width: 9px; height: 2px; top: -1px; }
#cross .v { width: 2px; height: 9px; left: -1px; }
#cross .dot { width: 3px; height: 3px; left: -1.5px; top: -1.5px; border-radius: 50%; }
#cross.ads .dot { width: 6px; height: 6px; left: -3px; top: -3px; background: var(--chads, #ff4b3a); box-shadow: 0 0 6px rgba(255, 70, 50, .9), 0 0 1px #000; }
/* crosshair styles (settings): the cross, a circle that opens with the spread, a big circle, or just a dot */
#cross .ring { display: none; left: 0; top: 0; width: 16px; height: 16px; background: transparent; border: 1.5px solid var(--ch, var(--ink)); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 2px rgba(0,0,0,.85), inset 0 0 2px rgba(0,0,0,.85); }
body[data-ch="circle"] #cross .h, body[data-ch="circle"] #cross .v, body[data-ch="big"] #cross .h, body[data-ch="big"] #cross .v, body[data-ch="dot"] #cross .h, body[data-ch="dot"] #cross .v { display: none; }
body[data-ch="circle"] #cross .ring, body[data-ch="big"] #cross .ring { display: block; }
body[data-ch="big"] #cross .ring { border-width: 2px; }
body[data-ch="dot"] #cross .dot { width: 5px; height: 5px; left: -2.5px; top: -2.5px; box-shadow: 0 0 3px rgba(0,0,0,.9); }
#hit { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; opacity: 0; }
#hit::before, #hit::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 2px; margin: -1px 0 0 -7px;
  background: var(--hitc, #fff); box-shadow: 0 0 3px rgba(0,0,0,.7); }
#hit::before { transform: rotate(45deg) translateX(9px); }
#hit::after { transform: rotate(-45deg) translateX(9px); }
#hit i, #hit b { position: absolute; left: 50%; top: 50%; width: 14px; height: 2px; margin: -1px 0 0 -7px; background: var(--hitc, #fff); box-shadow: 0 0 3px rgba(0,0,0,.7); }
#hit i { transform: rotate(45deg) translateX(-9px); }
#hit b { transform: rotate(-45deg) translateX(-9px); }

/* vignettes */
#hurt { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 40, 60, .55) 100%); }
#lowhp { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(120, 0, 20, .6) 100%); }
#dmgdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
#dmgdir .arc { position: absolute; left: -70px; top: -70px; width: 140px; height: 140px; border-radius: 50%;
  border: 4px solid transparent; border-top-color: var(--alarm); opacity: 0; filter: drop-shadow(0 0 6px var(--alarm)); }

/* top bar */
.top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wavebox { display: flex; align-items: stretch; gap: 0; background: var(--panel); border: 1px solid var(--panel-line); }
.wavebox > div { padding: 6px 14px; display: flex; flex-direction: column; gap: 2px; align-items: center; min-width: 74px; }
.wavebox > div + div { border-left: 1px solid var(--panel-line); }
.lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; color: var(--steel); text-transform: uppercase; }
.val { font-family: var(--font-mono); font-size: 18px; font-weight: 600; color: var(--ink); }
.val.sodium { color: var(--sodium); }

/* feed */
#feed { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px);
  display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-size: 13px; }
#feed div { background: var(--panel); border-right: 3px solid var(--sodium); padding: 4px 10px; transition: opacity .4s; }
#feed div.hs { border-right-color: var(--alarm); }
#feed b { font-family: var(--font-mono); color: var(--sodium); font-weight: 600; margin-left: 8px; }

/* vitals */
.vitals { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex; flex-direction: column; gap: 6px; width: min(280px, 42vw); }
.hprow { display: flex; align-items: baseline; gap: 10px; }
#hpnum { font-family: var(--font-mono); font-size: 34px; font-weight: 600; line-height: 1; }
.hpbar { height: 8px; background: rgba(233,228,216,.12); border: 1px solid var(--panel-line); position: relative; overflow: hidden; }
#hpfill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--vital); transition: width .15s, background-color .3s; }
#hpghost { position: absolute; inset: 0 auto 0 0; width: 100%; background: rgba(255,82,96,.55); transition: width .6s .25s; }

/* ammo */
.ammo { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.ammorow { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-mono); }
#mag { font-size: 40px; font-weight: 600; line-height: 1; }
#mag.low { color: var(--alarm); }
#reserve { font-size: 18px; color: var(--steel); }
#wname { font-family: var(--font-display); font-size: 18px; letter-spacing: .04em; color: var(--sodium); }
.slots { display: flex; gap: 4px; }
#deckhud .slots { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
.slots span { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border: 1px solid var(--panel-line); color: var(--steel); background: var(--panel); }
.slots span.on { color: var(--night); background: var(--sodium); border-color: var(--sodium); }
#reload { position: absolute; left: 50%; top: calc(50% + 44px); transform: translateX(-50%); width: 120px; height: 4px; background: rgba(233,228,216,.15); opacity: 0; }
#reload i { display: block; height: 100%; width: 0; background: var(--sodium); }
#hint { position: absolute; left: 50%; top: calc(50% + 58px); transform: translateX(-50%); font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; color: var(--sodium); opacity: 0; transition: opacity .2s; white-space: nowrap; }

/* banner */
#banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; opacity: 0; transition: opacity .35s; }
#banner .big { font-family: var(--font-display); font-size: clamp(40px, 9vw, 92px); color: var(--ink); letter-spacing: .02em; text-shadow: 0 4px 30px rgba(0,0,0,.6); }
#banner .small { margin-top: 6px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .18em; color: var(--sodium); }

/* menus */
.screen { position: fixed; inset: 0; display: grid; place-items: center; overflow-y: auto; z-index: 20;
  background: linear-gradient(180deg, rgba(13,18,32,.55), rgba(13,18,32,.88));
  padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { width: min(760px, 100%); background: rgba(16, 22, 38, .92); border: 1px solid var(--panel-line); position: relative; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px dashed var(--panel-line);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--steel); flex-wrap: wrap; }
.sheet-head .code { color: var(--sodium); }
.sheet-body { padding: 22px 22px 24px; display: grid; gap: 20px; }
.title { font-family: var(--font-display); font-size: clamp(54px, 12vw, 104px); line-height: .9; letter-spacing: .01em; color: var(--ink); text-wrap: balance; }
.title em { font-style: normal; color: var(--sodium); }
.lede { font-size: 15px; line-height: 1.65; color: #cfd5e0; max-width: 60ch; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.cols > section { min-width: 0; display: grid; gap: 8px; align-content: start; }
h3 { margin: 0; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .16em; color: var(--sodium); text-transform: uppercase; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; color: #cfd5e0; }
kbd { font-family: var(--font-mono); font-size: 11px; color: var(--ink); border: 1px solid var(--panel-line); border-bottom-width: 2px; padding: 1px 6px; white-space: nowrap; justify-self: start; }
.roster { display: grid; gap: 8px; }
.roster div { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: baseline; font-size: 13px; color: #cfd5e0; }
.roster i { width: 10px; height: 10px; background: var(--alarm); align-self: center; }
.roster i.b { background: var(--sodium); }
.roster i.c { background: #c86bff; }
.roster span { font-family: var(--font-mono); font-size: 11px; color: var(--steel); }
.roster .nm { font-family: var(--font-body); font-size: 13px; color: #cfd5e0; }
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn { font-family: var(--font-display); font-size: 20px; letter-spacing: .04em; color: var(--night); background: var(--sodium); border: 0; padding: 12px 26px; cursor: pointer; }
.btn:hover { background: #ffb85a; }
.btn:focus-visible, .ghost:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.ghost { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--ink); background: transparent; border: 1px solid var(--panel-line); padding: 11px 18px; cursor: pointer; }
.ghost:hover { border-color: var(--steel); }
.best { font-family: var(--font-mono); font-size: 12px; color: var(--steel); letter-spacing: .06em; }
.best b { color: var(--ink); font-weight: 600; }
.settings { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #cfd5e0; }
.settings label { display: flex; align-items: center; gap: 10px; }
.settings input[type=range] { width: 130px; accent-color: var(--sodium); }
.settings output { font-family: var(--font-mono); font-size: 12px; min-width: 2.5em; color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--panel-line); }
.stats div { padding: 12px 12px; display: grid; gap: 4px; }
.stats div + div { border-left: 1px solid var(--panel-line); }
.stats .val { font-size: 22px; }
.note { font-size: 12px; color: var(--steel); line-height: 1.5; }
.msg { font-family: var(--font-mono); font-size: 12px; color: var(--alarm); min-height: 1em; }
.stamp { position: absolute; right: 22px; top: 54px; transform: rotate(-8deg); font-family: var(--font-display); font-size: 26px; color: var(--alarm);
  border: 3px solid var(--alarm); padding: 2px 12px; opacity: .85; letter-spacing: .06em; }

/* touch controls */
#touch { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#touch .tbtn { position: absolute; pointer-events: auto; display: grid; place-items: center; border-radius: 50%;
  background: rgba(13,18,32,.45); border: 1.5px solid rgba(236,230,216,.35); color: var(--ink); font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; }
#touch .tbtn.on { background: rgba(242,163,58,.45); border-color: var(--sodium); }
#t-fire { width: 84px; height: 84px; right: calc(env(safe-area-inset-right, 0px) + 28px); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); font-size: 13px; }
#t-ads { width: 54px; height: 54px; right: calc(env(safe-area-inset-right, 0px) + 128px); bottom: calc(env(safe-area-inset-bottom, 0px) + 170px); }
#t-jump { width: 54px; height: 54px; right: calc(env(safe-area-inset-right, 0px) + 128px); bottom: calc(env(safe-area-inset-bottom, 0px) + 100px); }
#t-reload { width: 54px; height: 54px; right: calc(env(safe-area-inset-right, 0px) + 52px); bottom: calc(env(safe-area-inset-bottom, 0px) + 220px); }
#t-swap { width: 54px; height: 54px; right: calc(env(safe-area-inset-right, 0px) + 116px); bottom: calc(env(safe-area-inset-bottom, 0px) + 240px); }
/* 5.17: melee, under jump (the ammo count is under the fire button) */
#t-melee { width: 54px; height: 54px; right: calc(env(safe-area-inset-right, 0px) + 128px); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); }
/* very short landscape screens: the right-hand buttons a little smaller and closer, clear of the map button */
@media (orientation: landscape) and (max-height: 340px) {
  #t-fire { width: 78px; height: 78px; right: calc(env(safe-area-inset-right, 0px) + 26px); bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); }
  #t-ads { width: 50px; height: 50px; right: calc(env(safe-area-inset-right, 0px) + 116px); bottom: calc(env(safe-area-inset-bottom, 0px) + 152px); }
  #t-jump { width: 50px; height: 50px; right: calc(env(safe-area-inset-right, 0px) + 116px); bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); }
  #t-melee { width: 50px; height: 50px; right: calc(env(safe-area-inset-right, 0px) + 116px); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); }
  #t-reload { width: 50px; height: 50px; right: calc(env(safe-area-inset-right, 0px) + 50px); bottom: calc(env(safe-area-inset-bottom, 0px) + 196px); }
  #t-swap { width: 50px; height: 50px; right: calc(env(safe-area-inset-right, 0px) + 112px); bottom: calc(env(safe-area-inset-bottom, 0px) + 214px); }
}
